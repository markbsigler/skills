[project]
name = "skills-tools"
version = "0.1.0"
description = "Development tooling for the skills repository"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Mark Sigler" }]
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0,<10",
  "pytest-cov>=6.0,<8",
  "ruff>=0.15,<1",
  "mypy>=1.19,<2",
  "pre-commit>=4.0,<5",
]

# The repository contains standalone scripts, not an importable package.
[tool.uv]
package = false

# ── ruff: linting + formatting ────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["java-version-upgrade/scripts", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "RUF", # ruff-specific rules
  "PT",  # flake8-pytest-style
  "RET", # flake8-return
  "ISC", # implicit string concatenation
  "PIE", # flake8-pie
]
ignore = [
  "E501", # line length handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT011"] # pytest.raises(..., match=...) not required everywhere

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ── mypy: strict type checking ────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true
pretty = true
files = ["java-version-upgrade/scripts", "tests"]

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=java-version-upgrade/scripts",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=html",
  "--cov-report=xml",
]
filterwarnings = ["error"]

# ── coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["java-version-upgrade/scripts"]
branch = true
relative_files = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true
fail_under = 85
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
